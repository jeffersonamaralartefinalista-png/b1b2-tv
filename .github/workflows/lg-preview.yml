name: Validar protótipo LG (isolado)
on:
  push:
    branches:
      - design/lg-cinema-ui-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos e catálogo
        run: |
          test -s index.html
          test -s tv-theme.css
          test -s app.js
          python3 -m json.tool catalog.json >/dev/null
          grep -q 'tv-theme.css' index.html
      - name: Empacotar protótipo para teste local
        run: |
          mkdir -p dist
          cp index.html tv-theme.css app.js catalog.json manifest.webmanifest icon.svg sw.js dist/
      - uses: actions/upload-artifact@v4
        with:
          name: b1b2-tv-lg-cinema-preview
          path: dist/
          retention-days: 14
