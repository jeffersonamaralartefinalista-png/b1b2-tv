<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10172a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>B1&B2 Tv — Assista</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font:16px system-ui,sans-serif}header{padding:22px;background:#151f37;border-bottom:1px solid #334155}h1{margin:0}small{color:#a5b4cf}main{max-width:1100px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{background:#18243d;border:1px solid #334155;border-radius:12px;padding:18px}.card strong{display:block;margin-bottom:8px}.card span{color:#cbd5e1}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,select,input{font:inherit;border-radius:8px;border:1px solid #64748b;padding:11px;background:#1e293b;color:#fff}button{cursor:pointer}button:hover,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #67e8f9}input{width:100%;max-width:400px}video{width:100%;background:#000;aspect-ratio:16/9;border-radius:12px}.muted{color:#cbd5e1}#status{min-height:24px}.filters{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:12px 0 22px}.filters label{display:flex;align-items:center;gap:7px}.filters input[type=checkbox]{width:auto}footer{padding:22px;color:#a5b4cf;text-align:center}@media(max-width:600px){main{padding:14px}header{padding:16px}.filters>*{width:100%}}header{display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:5;box-shadow:0 8px 25px #0003}header h1{font-size:clamp(23px,3vw,34px)}header small{display:block;margin-top:4px}main{max-width:1250px}.card{transition:transform .15s,border-color .15s;min-height:145px}.card:hover{transform:translateY(-2px);border-color:#60a5fa}.card button:first-child{background:#2563eb;border-color:#2563eb;font-weight:700}video{max-height:68vh;box-shadow:0 12px 40px #0007}.filters{padding:16px;background:#151f37;border-radius:12px}.badge{font-size:12px;background:#1d4ed8;padding:7px 12px;border-radius:50px;white-space:nowrap}.intro{color:#a5b4cf;margin-top:0}@media(max-width:600px){header{position:static}.badge{display:none}.filters{padding:12px}video{border-radius:8px}}@media(prefers-reduced-motion:reduce){.card{transition:none}} </style></head><body><header><h1>📺 B1&amp;B2 Tv</h1><small>Protótipo independente • conteúdo demonstrativo</small><span class="badge">VERSÃO DE TESTES 0.5</span></header><main><p class="intro">Sua TV online em um só lugar. Nesta versão, apenas conteúdo demonstrativo.</p><h2 id="current">Escolha uma transmissão</h2><video id="player" controls playsinline aria-label="Reprodutor de vídeo"></video><p id="status" class="muted" role="status">Nenhum canal selecionado.</p><h2>Catálogo</h2><div class="filters"><input id="search" aria-label="Buscar transmissão" placeholder="Buscar transmissão"><select id="category" aria-label="Filtrar categoria"><option value="">Todas as categorias</option></select><label><input type="checkbox" id="favorites-only"> Somente favoritos</label></div><p id="count" class="muted"></p><div id="catalog" class="grid"></div></main><footer>Os vídeos não são armazenados ou retransmitidos por este aplicativo.</footer><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script><script src="./app.js" defer></script></body></html>
