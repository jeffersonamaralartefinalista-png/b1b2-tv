<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e22"><title>B1&B2 Tv — V14</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e22;color:#fff}header{padding:18px 20px 12px;text-align:center}h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:850}h1 span{color:#ffb34f}main{width:min(900px,100%);margin:auto;padding:0 14px 48px}.player{background:#000;aspect-ratio:16/9;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 12px 40px #0008}.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.player [hidden]{display:none!important}.idle{position:absolute;inset:0;display:grid;place-items:center;color:#aab5d6;font-size:44px}.idle[hidden]{display:none}#playing{margin:12px 2px 14px;font-size:17px;font-weight:750;min-height:22px}#playing:empty{margin:8px 0}.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.channel{min-width:0;min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid #34446e;border-radius:16px;background:linear-gradient(155deg,#1c2b57,#111b3b);color:#fff;padding:14px 8px;font:700 14px/1.25 system-ui;cursor:pointer;text-align:center;overflow-wrap:anywhere}.channel:active{transform:scale(.98)}.channel[aria-pressed=true]{border:2px solid #ffb34f;background:#283b6b}.channel .icon{font-size:23px;line-height:1;display:flex;align-items:center;justify-content:center;min-height:58px}.search{margin:12px 0 18px;position:relative}.saimo{margin-top:28px;border-top:1px solid #34446e;padding-top:14px}.saimo h2{font-size:18px;margin:4px 0 12px}.saimo input{width:100%;border:1px solid #41517c;border-radius:15px;background:#172348;color:#fff;padding:16px 18px;font:inherit;font-size:16px}.saimo #saimo-message{font-size:13px;color:#b4c0dd}.saimo .search-results{grid-template-columns:repeat(2,minmax(0,1fr))}.saimo .channel{min-height:70px;font-size:13px}.search input{width:100%;border:1px solid #41517c;border-radius:15px;background:#172348;color:white;padding:16px 18px;font:inherit;font-size:16px;outline:none}.search input:focus{border-color:#ffb34f}.search input::placeholder{color:#a8b5d3}.search-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.search-results:empty{display:none}#message{min-height:20px;color:#e9b5b5;font-size:13px}#close{position:absolute;z-index:3;right:9px;top:9px;background:#172348d9;color:white;border:1px solid #66769c;border-radius:100%;height:34px;width:34px;font-size:20px;display:none}#close.show{display:block}@media(min-width:650px){.channels,.search-results{grid-template-columns:repeat(4,minmax(0,1fr))}.channel{min-height:105px;font-size:16px}}@media(max-width:360px){.channel{font-size:12px;min-height:85px}} </style></head><body><header><h1>B1<span>&amp;</span>B2 Tv</h1></header><main><div class="player" id="viewer"><div class="idle" id="idle">▶</div><button id="close" aria-label="Fechar vídeo">×</button><iframe id="screen" title="TV ao vivo" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" hidden></iframe><video id="video" controls playsinline hidden></video></div><div id="playing"></div><div class="search search-top"><input id="search" type="search" placeholder="🔎 Buscar canal" aria-label="Buscar canal" autocomplete="off"><div id="results" class="search-results"></div><div id="message" role="status"></div></div><div class="channels" id="channels"></div><section class="saimo"><h2>🔎 Descobrir canais</h2><input id="saimo-search" type="search" placeholder="Buscar no Saimo" aria-label="Buscar canais no Saimo"><div id="saimo-results" class="search-results"></div><p id="saimo-message" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script><script>(function(){'use strict';const channels=[{"name":"TV Câmara","kind":"iframe","url":"https://www2.camara.leg.br/camaranoticias/tv/embedAoVivo.html","category":"TV"},{"name":"TV Brasil","kind":"iframe","url":"https://aovivo.ebc.com.br/embed-tvbrasil.html","category":"TV"},{"name":"TV Cultura","kind":"iframe","url":"https://culturaplay.tvcultura.com.br/channels/14/embed","category":"TV"},{"name":"Cultura Fast","kind":"iframe","url":"https://culturaplay.tvcultura.com.br/channels/53/embed","category":"TV"},{"name":"Band RS","kind":"iframe","url":"https://beyond.spalla.io/player/?live=019a797e-eeb8-7eda-9518-132403ccb160","category":"TV"},{"name":"Os Padrinhos Mágicos","kind":"hls","url":"https://jmp2.uk/plu-63221e41af69b500076f84e7.m3u8","category":"Desenhos"},{"name":"O Reino Infantil","kind":"hls","url":"https://jmp2.uk/plu-5f5c216df68f920007888315.m3u8","category":"Desenhos"},{"name":"As Tartarugas Ninja","kind":"hls","url":"https://jmp2.uk/plu-63dd5c904e83e700088fb68a.m3u8","category":"Desenhos"},{"name":"Desenhos Clássicos","kind":"hls","url":"https://jmp2.uk/plu-655e5c4d2c46f3000877a54b.m3u8","category":"Desenhos"},{"name":"Turma da Mônica","kind":"hls","url":"https://jmp2.uk/plu-5f997e44949bc70007a6941e.m3u8","category":"Desenhos"},{"name":"Bob Esponja","kind":"hls","url":"https://jmp2.uk/plu-62545c0b002f4b0007688b61.m3u8","category":"Desenhos"},{"name":"iCarly","kind":"hls","url":"https://jmp2.uk/plu-620ff46e0a576e0007dc2f89.m3u8","category":"Séries"},{"name":"South Park","kind":"hls","url":"https://jmp2.uk/plu-609ae66b359b270007869ff1.m3u8","category":"Séries"},{"name":"CSI Miami","kind":"hls","url":"https://jmp2.uk/plu-63eb9c5351f5d000085e8d7e.m3u8","category":"Séries"},{"name":"NCIS","kind":"hls","url":"https://jmp2.uk/plu-63eb9fdda995710008991c54.m3u8","category":"Séries"},{"name":"Z Nation","kind":"hls","url":"https://d1si3n1st4nkgb.cloudfront.net/10000/88876018/hls/master.m3u8?ads.xumo_channelId=88876018","category":"Séries"},{"name":"Ficção Científica","kind":"hls","url":"https://jmp2.uk/plu-5fa15ad6367e170007cdd098.m3u8","category":"Filmes"},{"name":"Filmes Aventura","kind":"hls","url":"https://jmp2.uk/plu-66c79a4262e5510008ff68a5.m3u8","category":"Filmes"},{"name":"Filmes Sucessos","kind":"hls","url":"https://jmp2.uk/plu-5f120e94a5714d00074576a1.m3u8","category":"Filmes"},{"name":"Runtime Comédia","kind":"hls","url":"https://stream.ads.ottera.tv/playlist.m3u8?network_id=2553","category":"Filmes"},{"name":"TV Filmes Nacionais","kind":"hls","url":"https://jmp2.uk/plu-5f5a545d0dbf7f0007c09408.m3u8","category":"Filmes"}];const frame=document.getElementById('screen'),video=document.getElementById('video'),idle=document.getElementById('idle'),now=document.getElementById('playing'),close=document.getElementById('close'),grid=document.getElementById('channels'),results=document.getElementById('results'),search=document.getElementById('search'),message=document.getElementById('message');let hls=null,selected=null;function stop(){video.pause();if(hls){hls.destroy();hls=null}video.removeAttribute('src');video.load();frame.src='about:blank';frame.hidden=true;video.hidden=true;idle.hidden=false;now.textContent='';close.classList.remove('show');selected=null;document.querySelectorAll('.channel').forEach(b=>b.setAttribute('aria-pressed','false'));message.textContent=''}function play(c){stop();selected=c.name;now.textContent=c.name;idle.hidden=true;close.classList.add('show');document.querySelectorAll('.channel').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.name===c.name)));if(c.kind==='iframe'){frame.hidden=false;frame.src=c.url}else{video.hidden=false;if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=c.url;video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}))}else{message.textContent='Vídeo indisponível neste navegador.'}}document.getElementById('viewer').scrollIntoView({behavior:'smooth',block:'start'})}function icon(name){const icons={'TV Câmara':'🏛️','TV Brasil':'🇧🇷','TV Cultura':'🎭','Cultura Fast':'🎨','Band RS':'📡','Os Padrinhos Mágicos':'🪄','O Reino Infantil':'👑','As Tartarugas Ninja':'🐢','Desenhos Clássicos':'🐭','Turma da Mônica':'🐰','Bob Esponja':'🧽','iCarly':'🎤','South Park':'🏔️','CSI Miami':'🔎','NCIS':'🕵️','Z Nation':'🧟','Ficção Científica':'🚀','Filmes Aventura':'🧭','Filmes Sucessos':'🏆','Runtime Comédia':'😂','TV Filmes Nacionais':'🎞️'};return icons[name]||'📺'}function card(c){const b=document.createElement('button');b.className='channel';b.type='button';b.dataset.name=c.name;b.setAttribute('aria-pressed',String(selected===c.name));const i=document.createElement('span');i.className='icon';if(c.name==='Bob Esponja'||c.name==='As Tartarugas Ninja'){const img=document.createElement('img');img.alt='';img.loading='lazy';img.style.cssText='width:58px;height:58px;object-fit:contain;display:block';img.src=c.name==='Bob Esponja'?'https://upload.wikimedia.org/wikipedia/en/3/3b/SpongeBob_SquarePants_character.svg':'https://upload.wikimedia.org/wikipedia/en/8/85/TMNT2007.jpg';img.onerror=()=>{i.textContent=icon(c.name)};i.appendChild(img)}else{i.textContent=icon(c.name)}const n=document.createElement('span');n.textContent=c.name;b.append(i,n);b.onclick=()=>play(c);return b}channels.forEach(c=>grid.appendChild(card(c)));search.addEventListener('input',()=>{results.replaceChildren();const q=search.value.trim().toLocaleLowerCase('pt-BR');grid.hidden=!!q;if(!q){message.textContent='';return}const matches=channels.filter(c=>c.name.toLocaleLowerCase('pt-BR').includes(q));matches.forEach(c=>results.appendChild(card(c)));message.textContent=matches.length?'':'Nenhum canal encontrado.'});const si=document.getElementById('saimo-search'),sr=document.getElementById('saimo-results'),sm=document.getElementById('saimo-message');let saimo=[];fetch('https://saimo-canais.pages.dev/catalogo.txt').then(r=>{if(!r.ok)throw Error('offline');return r.text()}).then(t=>{let last='';for(const line of t.split(/\r?\n/)){const raw=line.trim();const nm=raw.match(/(?:nome|name|canal|title)\s*[:=]\s*[\"']?([^\"',;}{]+)/i);if(nm)last=nm[1].trim();const pipe=raw.match(/^(.+?)\|\s*(https?:\/\/\S+)/i);if(pipe){saimo.push({name:pipe[1].trim(),url:pipe[2].trim()});continue}const urls=raw.match(/https?:\/\/[^\s\"'<>|,;]+/gi)||[];for(const url of urls){if(!/\.(m3u8|mpd)(\?|$)/i.test(url))continue;const before=raw.slice(0,raw.indexOf(url)).replace(/(?:url|fonte|source)\s*[:=]\s*$/i,'').trim();saimo.push({name:before&&!before.startsWith('http')?before:last||'Canal',url})}}sm.textContent='';}).catch(()=>{sm.textContent='Catálogo indisponível no momento.'});si.addEventListener('input',()=>{sr.replaceChildren();const q=si.value.trim().toLocaleLowerCase('pt-BR');if(q.length<2){sm.textContent='';return}const matches=saimo.filter(x=>x.name.toLocaleLowerCase('pt-BR').includes(q)&&!channels.some(c=>c.url===x.url)).slice(0,30);matches.forEach(x=>{const b=document.createElement('button');b.className='channel';b.textContent='📺 '+x.name;b.onclick=()=>play({name:x.name,kind:'hls',url:x.url});sr.appendChild(b)});sm.textContent=matches.length?'':'Nenhum canal encontrado.'});close.onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()})})();</script></body></html>
